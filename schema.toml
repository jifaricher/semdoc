# =============================================================================
# semdoc schema template (library semantics)
# =============================================================================
# Usage: semdoc init --schema schema.toml --db <db-path>
#        At init time this file is copied to <db>/schema.toml; afterwards
#        the in-database copy is authoritative.
#
# This file shows the "minimal default shape" of a schema.toml: just
# [table] + a single default vector column. [fields]/[plugins] are all
# optional — omit what you don't need.
#
# Note: an empty schema.toml (0 bytes) is also valid, equivalent to this
# file with every optional section removed:
#   table "documents" + one vector column dense_vec (dim = default
#   embedder dimension)
#
# 中文参考版: schema_ZH.toml(仅供参考,以本文件为准)
# =============================================================================

[table]
# LanceDB table name (one table per database)
# Default: "documents"
name = "documents"

# ---------------------------------------------------------------------------
# Vector columns. With no [[vector.fields]] at all, one default column is
# derived (exactly the values below):
#   name="dense_vec", dim=default embedder dimension (probed at init,
#   usually 1024), source="raw_text", metric="cosine", index="none",
#   auto_embed=true
# Writing the section out explicitly overrides the default; multiple
# columns (multi-way retrieval) are supported, one [[vector.fields]]
# section per column.
# ---------------------------------------------------------------------------
[[vector.fields]]
name = "dense_vec"
# Default: probed from the configured embedder at init (bge-m3 = 1024)
dim = 1024
# Default: "raw_text"
source = "raw_text"
# Choices: "cosine" (default) | "l2" | "dot"
metric = "cosine"
# Choices: "none" (default) | "ivf_pq" | "ivf_flat"
index = "none"
# Default: true (false = only client-pre-embedded writes are accepted)
auto_embed = true

# ---------------------------------------------------------------------------
# User-defined scalar fields (optional). Examples:
# [fields]
# domain   = { type = "string",  index = true }   # index defaults to false
# priority = { type = "int64",   index = true }
# verified = { type = "bool" }
# tags     = { type = "list<string>" }            # $in/$nin membership filters
# notes    = { type = "text" }                    # FTS search / vector source
# score    = { type = "float32", required = true } # required defaults to false
# Reserved columns (may not be redeclared): id, raw_text, chunk_level,
#                    chunk_index, parent_doc_id
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Graph retrieval plugin (optional). Omit = disabled.
# ---------------------------------------------------------------------------
# [plugins.graph]
# backend = "lightrag-server"        # "lightrag-server" | "lightrag-embedded" (requires feature)
# endpoint = "http://127.0.0.1:9727" # required for lightrag-server
# api_key_env = "LIGHTRAG_API_KEY"   # optional
# query_timeout_secs = 60            # default: 60
# insert_concurrency = 4             # default: 4
# workspace = "./rag_storage"        # lightrag-embedded only
