# =============================================================================
# semdoc deployment configuration (Config.toml)
# =============================================================================
# This file holds deployment facts only — it follows the environment and
# does NOT travel with the database:
#
#   [embedding]  embedding backend (endpoint/model)
#   [rerank]     rerank backend (endpoint/model)
#   [chunk]      chunking parameters
#   [server]     HTTP server listen address and auth
#   [tls]        outbound HTTPS certificate policy
#
# Library semantics ([table]/[vector]/[fields]/[plugins.graph]) all live in
# schema.toml, copied to <db>/schema.toml by `semdoc init`; afterwards the
# in-database copy is authoritative. If schema sections are mistakenly
# written here, the loader names each one in a startup warning (they have
# no runtime effect).
#
# Lookup order: --config <path> > $SEMDOC_CONFIG > ./Config.toml > defaults+env
# Priority:     CLI flag > environment variables > this file > built-in defaults
# Secrets:      write only *_env (the NAME of an env var) here; the value
#               itself stays in the environment
#
# 中文参考版: Config_ZH.toml(仅供参考,以本文件为准)
# =============================================================================

# ---------------------------------------------------------------------------
# Embedding backend. backend: "http" (OpenAI-compatible /v1/embeddings)
#                             | "onnx" (requires the `onnx` feature)
# ---------------------------------------------------------------------------
[embedding]
backend = "http"
# http: endpoint (including /v1), required
url = "http://192.168.1.7:11434/v1"
# http: model name, required
model = "bge-m3"
# Env var NAME holding the API key (optional)
# api_key_env = "MY_EMBEDDER_KEY"
# Request timeout in seconds
# Default: 60
# timeout_secs = 60
# onnx only: model directory
# Default: ~/.cache/semdoc/models/bge-m3
# dir = "~/.cache/semdoc/models/bge-m3"

# ---------------------------------------------------------------------------
# Rerank backend. backend: "tei" | "openai" | "onnx" (requires the `onnx`
# feature) | "none" (disabled). This section is the ONLY source of truth
# for rerank (schema.toml declares nothing about it).
# ---------------------------------------------------------------------------
[rerank]
backend = "tei"
# tei/openai: endpoint (openai must include /v1), required
endpoint = "http://192.168.1.7:8000"
# api_key_env = "MY_TEI_KEY"
# Request timeout in seconds
# Default: 120
# timeout_secs = 120
# openai only: model name (optional)
# model = "bge-reranker-v2-m3"
# onnx only:
# Default: ~/.cache/semdoc/models/bge-reranker-v2-m3
# dir = "~/.cache/semdoc/models/bge-reranker-v2-m3"

# ---------------------------------------------------------------------------
# Chunking parameters (applied at write time)
# ---------------------------------------------------------------------------
[chunk]
# Target chunk size in Unicode chars, range [64, 8192]
# Default: 512
size = 512
# Overlap between adjacent chunks (~10% of size)
# Default: 50
overlap = 50

# ---------------------------------------------------------------------------
# HTTP server parameters (read by semdoc-server)
# ---------------------------------------------------------------------------
[server]
# Listen address
# Default: "127.0.0.1:8092" (CLI --listen overrides)
listen = "127.0.0.1:8092"
# Env var NAME holding the Bearer token; unset = no auth
# token_env = "SEMDOC_SERVER_TOKEN"

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------
[tls]
# Accept invalid certs (self-signed endpoints on internal networks).
# Default: false. WARNING: this disables certificate verification for ALL
# outbound HTTPS — Bearer tokens become interceptable. Prefer ca_bundle.
insecure = false
# Company-internal CA certificate(s) in PEM format (may contain several):
# added to the trust chain while keeping all other verification.
# Example: ca_bundle = "/etc/semdoc/company-ca.pem"
# Default: unset (system certificate store only)
# ca_bundle = ""
